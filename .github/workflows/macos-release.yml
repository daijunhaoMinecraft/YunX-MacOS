name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            expected_machine: x86_64
          - runner: macos-15
            arch: arm64
            expected_machine: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        run: |
          actual="$(uname -m)"
          echo "runner=$(uname -a)"
          echo "expected=${{ matrix.expected_machine }} actual=${actual}"
          test "${actual}" = "${{ matrix.expected_machine }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.arch }}-
            gradle-${{ runner.os }}-

      - name: Build DMG
        run: ./gradlew :desktop:packageDmg --console=plain -PuseChinaMirrors=false

      - name: Rename and checksum artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(head -n 1 version.txt | tr -d '[:space:]')"
          source_dmg="$(find desktop/build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${source_dmg}"
          mkdir -p dist
          target="dist/YunX-Desktop-${version}-macOS-${{ matrix.arch }}.dmg"
          cp "${source_dmg}" "${target}"
          hdiutil verify "${target}"
          (
            cd dist
            shasum -a 256 "$(basename "${target}")" > "$(basename "${target}").sha256"
          )
          ls -lh dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: YunX-Desktop-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: YunX-Desktop-macOS-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          title="云析桌面版 ${TAG} · macOS"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --title "${title}" --notes-file Releases.md --latest
          else
            gh release create "${TAG}" dist/* \
              --title "${title}" \
              --notes-file Releases.md \
              --latest
          fi
